<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Diagnostic de gestion gratuit pour PME : un score par fonction, les problèmes repérés et le coût du temps perdu. GESCOP.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Diagnostic d'entreprise · GESCOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: fiche de diagnostic — rail des sections à gauche, une section à la fois, rapport en fin de parcours */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#15242B; --muted:#56676C; --line:#D3DCDB;
  --accent:#1D5C63; --accent-ink:#FFFFFF; --accent-soft:#DDEBEA;
  --good:#2C7A4B; --warn:#A86B12; --bad:#B03F2C;
  --good-soft:#E1F0E6; --warn-soft:#F6EBD6; --bad-soft:#F6E1DC;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1619; --surface:#162126; --ink:#E3EBEB; --muted:#94A4A7; --line:#283840;
  --accent:#73B5BA; --accent-ink:#0E1619; --accent-soft:#1B3236;
  --good:#5CB585; --warn:#E2A94E; --bad:#E77B65;
  --good-soft:#173027; --warn-soft:#33281A; --bad-soft:#38201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#162126; --ink:#E3EBEB; --muted:#94A4A7; --line:#283840;
  --accent:#73B5BA; --accent-ink:#0E1619; --accent-soft:#1B3236;
  --good:#5CB585; --warn:#E2A94E; --bad:#E77B65;
  --good-soft:#173027; --warn-soft:#33281A; --bad-soft:#38201B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.12}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:24px}
.top .brand{font-family:var(--f-display);font-weight:600;font-size:20px}
.top .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Intro */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}
.intro .lead{font-size:17px;max-width:60ch;margin-top:14px}
.intro .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500}
.facts span{font-size:13px;color:var(--muted)}
.toc{background:var(--surface);border:1px solid var(--line);padding:18px 20px}
.toc ol{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.toc li{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toc li:last-child{border-bottom:0}
.toc .code{font-family:var(--f-mono);font-size:12px;color:var(--accent);min-width:36px}
.note{font-size:13px;color:var(--muted);margin-top:16px;max-width:60ch}

/* Form layout */
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:2px}
.rail button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:8px 10px;color:var(--muted);font-size:14px;border-radius:0 4px 4px 0}
.rail button:hover{color:var(--ink);background:var(--surface)}
.rail button.on{color:var(--ink);border-left-color:var(--accent);background:var(--surface);font-weight:500}
.rail .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.rail .cnt.done{color:var(--good)}
.rail .sep{height:1px;background:var(--line);margin:8px 0}
.sec-head{display:grid;gap:6px;margin-bottom:20px}
.sec-head p{max-width:62ch;color:var(--muted)}
.progress{height:4px;background:var(--line);margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qs{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);padding:16px 18px;border-radius:6px;display:grid;gap:10px;min-width:0}
.q.follow{margin-left:22px;border-left:3px solid var(--accent);background:var(--accent-soft);border-color:transparent;border-left-color:var(--accent)}
.q-top{display:flex;gap:12px;align-items:baseline}
.q-code{font-family:var(--f-mono);font-size:11px;color:var(--accent);flex:none;min-width:52px}
.q-text{font-weight:500}
.q-hint{font-size:13px;color:var(--muted);margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:5px;font-size:14px;background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.35}
.opt input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.scale{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scale .opt span{min-width:40px;text-align:center;font-family:var(--f-mono)}
.scale small{font-size:12px;color:var(--muted)}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;max-width:100%}
input[type=number]{width:160px;font-family:var(--f-mono)}
input[type=text]{width:420px}
textarea{width:100%;min-height:90px;resize:vertical}
.unit{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* Report */
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:20px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}
.rep-head .who{display:grid;gap:6px}
.rep-actions{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;min-width:0}
.panel h3{margin-bottom:12px}
.global{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.global b{font-family:var(--f-mono);font-size:52px;font-weight:500;line-height:1}
.bars{display:grid;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--bg);border-radius:2px;overflow:hidden;position:relative}
.bar .track i{display:block;height:100%}
.bar .track::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(40% - 1px),var(--line) 40%,transparent calc(40% + 1px),transparent calc(70% - 1px),var(--line) 70%,transparent calc(70% + 1px))}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding:8px 10px 8px 0}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.n{text-align:right}
.section{margin-top:28px}
.section > h3{margin-bottom:12px}
.quotes{display:grid;gap:10px}
.quotes div{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:14px}
.quotes small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.empty{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
#copyArea{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;margin-top:10px}

@media (max-width:820px){
  .intro,.grid2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .rail button{flex:none;border-left:0;border-bottom:3px solid transparent;border-radius:4px 4px 0 0}
  .rail button.on{border-bottom-color:var(--accent)}
  .rail .sep{display:none}
  .q.follow{margin-left:10px}
  input[type=text]{width:100%}
  .bar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 40px}
  .facts{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Diagnostic d'entreprise</span>
    <span class="meta" id="topMeta">Questionnaire · 11 sections</span>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Données ---------- */
const CURR=[["CAD","Dollar canadien (CAD)"],["USD","Dollar américain (USD)"],["EUR","Euro (EUR)"],["XOF","Franc CFA BCEAO (XOF)"],["XAF","Franc CFA BEAC (XAF)"],["GBP","Livre sterling (GBP)"],["CHF","Franc suisse (CHF)"],["MAD","Dirham marocain (MAD)"],["TND","Dinar tunisien (TND)"],["DZD","Dinar algérien (DZD)"],["HTG","Gourde haïtienne (HTG)"],["MXN","Peso mexicain (MXN)"],["BRL","Réal brésilien (BRL)"],["AUTRE","Autre monnaie"]];

const SECTIONS=[
 {id:"P",title:"Profil et paramètres",intro:"Ces informations ne sont pas notées. Elles adaptent la suite du questionnaire et servent à calculer les coûts dans votre monnaie."},
 {id:"DIR",title:"Direction et priorités",intro:"Comment le dirigeant utilise son temps et pilote l'entreprise."},
 {id:"FIN",title:"Finances et rentabilité",intro:"Marges, trésorerie et suivi des chiffres. Des estimations suffisent."},
 {id:"VEN",title:"Ventes et clients",intro:"D'où viennent les clients, combien reviennent et comment l'information est conservée."},
 {id:"MKT",title:"Marketing et présence",intro:"Visibilité, prix et ce qui distingue l'entreprise."},
 {id:"OPS",title:"Opérations et processus",intro:"Le parcours d'une commande, les erreurs et les tâches répétitives."},
 {id:"RH",title:"Ressources humaines",intro:"Roulement, formation et charge administrative de l'équipe."},
 {id:"STK",title:"Stocks et approvisionnement",intro:"Section affichée parce que l'entreprise vend des produits.",show:()=>A.P04 && A.P04!=="services"},
 {id:"OUT",title:"Outils et données",intro:"Logiciels, documents, sauvegardes et décisions appuyées sur des chiffres."},
 {id:"ADM",title:"Administration et conformité",intro:"Obligations légales, fiscales et contrats."},
 {id:"CLO",title:"Clôture",intro:"Dernières précisions avant le rapport."}
];

let A={};
const v=id=>A[id];
const n=id=>{const x=A[id];if(x===undefined||x===null||x==="")return null;const f=parseFloat(String(x).replace(",","."));return isFinite(f)?f:null};
const has=(id,val)=>Array.isArray(A[id])&&A[id].includes(val);
const cnt=id=>Array.isArray(A[id])?A[id].length:0;
const any=(id,ex)=>cnt(id)>0&&!has(id,ex);
const E=()=>n("P06");
const S=()=>n("P09")||48;
const CA=()=>n("P07");
const H=()=>v("P08")==="oui"?n("P08a"):(v("P08")==="non"&&n("P08b")!==null?n("P08b")/173:null);
const CUR=()=>v("P02")==="AUTRE"?String(v("P02b")||"").trim().toUpperCase():(v("P02")||"");
const yn=[["oui","Oui"],["non","Non"]];

const Q=[
/* Profil */
{id:"P00",s:"P",q:"Nom de l'entreprise",t:"text",ph:"Ex. : Atelier Martin"},
{id:"P01",s:"P",q:"Pays et ville où l'entreprise exerce",t:"text",ph:"Ex. : Abidjan, Côte d'Ivoire"},
{id:"P02",s:"P",q:"Monnaie utilisée principalement",t:"select",o:CURR},
{id:"P02b",s:"P",f:1,q:"Code de la monnaie, en trois lettres",t:"text",ph:"Ex. : GHS",show:()=>v("P02")==="AUTRE"},
{id:"P03",s:"P",q:"Secteur d'activité",t:"choice",o:[["detail","Commerce de détail"],["resto","Restauration"],["services","Services professionnels"],["construction","Construction"],["fabrication","Fabrication"],["sante","Santé"],["transport","Transport"],["autre","Autre"]]},
{id:"P04",s:"P",q:"L'entreprise vend…",t:"choice",o:[["produits","Des produits"],["services","Des services"],["deux","Les deux"]]},
{id:"P05",s:"P",q:"Depuis combien d'années l'entreprise existe-t-elle ?",t:"num",unit:"ans"},
{id:"P06",s:"P",q:"Combien de personnes y travaillent, propriétaire compris ?",t:"num",unit:"personnes"},
{id:"P07",s:"P",q:"Chiffre d'affaires annuel approximatif",t:"num",unit:"$C par an"},
{id:"P08",s:"P",q:"Connaissez-vous le coût horaire moyen d'un employé, charges comprises ?",t:"choice",o:[["oui","Oui"],["non","Non, mais je connais le salaire mensuel moyen"]]},
{id:"P08a",s:"P",f:1,q:"Coût horaire moyen d'un employé",t:"num",unit:"$C par heure",show:()=>v("P08")==="oui"},
{id:"P08b",s:"P",f:1,q:"Salaire mensuel moyen d'un employé",t:"num",unit:"$C par mois",hint:"Le coût horaire sera estimé sur une base de 173 heures par mois.",show:()=>v("P08")==="non"},
{id:"P09",s:"P",q:"Combien de semaines par an l'entreprise est-elle en activité ?",t:"num",unit:"semaines",ph:"48"},
{id:"P10",s:"P",q:"Quelle part des ventes se fait en espèces ou sans facture formelle ?",t:"choice",o:[["lt10","Moins de 10 %"],["10-30","10 à 30 %"],["30-60","30 à 60 %"],["gt60","Plus de 60 %"]]},
{id:"P11",s:"P",q:"Quels outils numériques l'entreprise utilise-t-elle ?",t:"multi",ex:"aucun",o:[["compta","Logiciel comptable"],["pos","Caisse ou point de vente"],["crm","Logiciel de gestion clients"],["tableur","Tableur (Excel, Sheets)"],["ecom","Vente en ligne"],["msg","Messagerie (courriel, WhatsApp)"],["aucun","Aucun"]]},

/* Direction */
{id:"DIR-01",s:"DIR",q:"À quelle activité le dirigeant consacre-t-il le plus de temps chaque semaine ?",t:"choice",o:[["admin","Administration"],["ventes","Ventes"],["prod","Production ou prestation"],["rh","Gestion du personnel"],["compta","Comptabilité"],["autre","Autre"]],
 score:()=>{const a=v("DIR-01");if(!a)return null;if(a!=="admin"&&a!=="compta")return 4;const h=n("DIR-01h");if(h===null)return null;return h<5?4:h<=15?2:0},
 issue:"Le dirigeant consacre une grande part de son temps à l'administratif ou à la comptabilité."},
{id:"DIR-01h",s:"DIR",f:1,q:"Combien d'heures par semaine environ ?",t:"num",unit:"h par semaine",show:()=>!!v("DIR-01")},
{id:"DIR-01t",s:"DIR",f:1,q:"Quelles tâches précises ?",t:"text",show:()=>["admin","compta"].includes(v("DIR-01"))&&n("DIR-01h")>10},
{id:"DIR-02",s:"DIR",q:"Avec dix heures de plus par semaine, à quoi le dirigeant les consacrerait-il ?",t:"text"},
{id:"DIR-03",s:"DIR",q:"Quel problème aimeriez-vous voir disparaître en premier ?",t:"text"},
{id:"DIR-04",s:"DIR",q:"L'entreprise a-t-elle des objectifs chiffrés pour l'année ?",t:"choice",o:[["oui","Oui, suivis régulièrement",4],["peu","Oui, mais peu suivis",2],["non","Non",0]],issue:"Pas d'objectifs chiffrés suivis régulièrement."},
{id:"DIR-04b",s:"DIR",f:1,q:"Pourquoi sont-ils peu suivis ?",t:"choice",o:[["temps","Manque de temps"],["donnees","Données difficiles à obtenir"],["outil","Pas d'outil adapté"],["autre","Autre raison"]],show:()=>v("DIR-04")==="peu"},
{id:"DIR-05",s:"DIR",q:"Si le dirigeant était absent pendant un mois, l'entreprise fonctionnerait…",t:"scale",lo:"Elle s'arrêterait",hi:"Normalement",
 score:()=>{const x=n("DIR-05");return x===null?null:x<=2?0:x===3?2:4},issue:"L'entreprise dépend fortement de la présence du dirigeant."},
{id:"DIR-05b",s:"DIR",f:1,q:"Quelles décisions ou tâches seraient bloquées ?",t:"text",show:()=>n("DIR-05")!==null&&n("DIR-05")<=2},

/* Finances */
{id:"FIN-01",s:"FIN",q:"Connaissez-vous votre marge ?",t:"choice",o:[["produit","Par produit ou par service",4],["globale","Globale seulement",2],["non","Non",0]],issue:"La marge n'est pas connue par produit ou par service."},
{id:"FIN-02",s:"FIN",f:1,q:"Pouvez-vous estimer votre marge brute globale ?",t:"num",unit:"%",hint:"Ventes moins coût direct des ventes, divisé par les ventes.",show:()=>!!v("FIN-01")&&v("FIN-01")!=="produit"},
{id:"FIN-03",s:"FIN",q:"Savez-vous quels produits ou services sont les moins rentables ?",t:"choice",o:[["oui","Oui",4],["non","Non",0]],issue:"Les produits ou services les moins rentables ne sont pas identifiés."},
{id:"FIN-03b",s:"FIN",f:1,q:"Lesquels, et quelle part des ventes représentent-ils ?",t:"text",show:()=>v("FIN-03")==="oui"},
{id:"FIN-04",s:"FIN",q:"Quelle part des revenus sert à couvrir les coûts fixes (loyer, salaires, abonnements) ?",t:"num",unit:"%",
 score:()=>{const x=n("FIN-04");return x===null?null:x<40?4:x<=60?2:0},issue:"Les coûts fixes pèsent lourd par rapport aux revenus."},
{id:"FIN-05",s:"FIN",q:"En combien de jours les clients paient-ils en moyenne ?",t:"num",unit:"jours",show:()=>v("P10")!=="gt60",
 score:()=>{const x=n("FIN-05");return x===null?null:x<=30?4:x<=60?2:0},issue:"Les clients paient trop lentement."},

/* ---------- Calculs ---------- */
const visible=q=>{const sec=SECTIONS.find(s=>s.id===q.s);if(sec.show&&!sec.show())return false;return q.show?!!q.show():true};
const visSections=()=>SECTIONS.filter(s=>!s.show||s.show());
const answered=q=>{const x=A[q.id];return Array.isArray(x)?x.length>0:(x!==undefined&&x!==null&&String(x).trim()!=="")};
function scoreOf(q){
  if(!visible(q))return null;
  if(q.score)return q.score();
  if(q.t==="choice"&&q.o&&q.o.some(o=>o.length>2)){const o=q.o.find(o=>o[0]===A[q.id]);return o?o[2]:null}
  return null;
}
const isScored=q=>!!q.score||(q.t==="choice"&&q.o&&q.o.some(o=>o.length>2));
function sectionScore(sid){
  let pts=0,max=0,qs=Q.filter(q=>q.s===sid&&isScored(q));
  qs.forEach(q=>{const s=scoreOf(q);if(s!==null&&s!==undefined){pts+=s;max+=4}});
  return max?{score:Math.round(pts/max*100),pts,max}:null;
}
function report(){
  const secs=visSections().map(s=>({...s,r:sectionScore(s.id)})).filter(s=>s.r);
  const tp=secs.reduce((a,s)=>a+s.r.pts,0),tm=secs.reduce((a,s)=>a+s.r.max,0);
  const global=tm?Math.round(tp/tm*100):null;
  const issues=[];
  Q.forEach(q=>{if(!isScored(q))return;const s=scoreOf(q);if(s===0||s===2)issues.push({q,s,sec:SECTIONS.find(x=>x.id===q.s)})});
  issues.sort((a,b)=>a.s-b.s||SECTIONS.indexOf(a.sec)-SECTIONS.indexOf(b.sec));
  const costs=Q.filter(q=>q.cost&&visible(q)).map(q=>q.cost()).filter(Boolean);
  const h=H(),ca=CA();
  costs.forEach(c=>{c.money=h?c.hy*h:null;c.pct=(c.money!==null&&ca)?c.money/ca*100:null});
  costs.sort((a,b)=>b.hy-a.hy);
  const totH=costs.reduce((a,c)=>a+c.hy,0),totM=h?totH*h:null,totP=(totM!==null&&ca)?totM/ca*100:null;
  return {secs,global,issues,costs,totH,totM,totP};
}
function reliability(){
  const p=v("P10");
  if(p==="gt60"||has("P11","aucun"))return ["Faible","Les résultats reposent surtout sur des déclarations.","bad"];
  if(p==="30-60"||(cnt("P11")>0&&!has("P11","compta")&&!has("P11","pos")))return ["Moyenne","Une partie des chiffres est estimée.","warn"];
  if(!p&&cnt("P11")===0)return ["Non évaluée","Profil incomplet.","warn"];
  return ["Bonne","Les chiffres peuvent être vérifiés dans les outils.","good"];
}
const level=s=>s>=70?"good":s>=40?"warn":"bad";
const levelTxt=s=>s>=70?"Satisfaisant":s>=40?"À surveiller":"En difficulté";
function money(x){
  if(x===null||x===undefined)return "—";
  const c=CUR();
  try{if(/^[A-Z]{3}$/.test(c))return new Intl.NumberFormat("fr-CA",{style:"currency",currency:c,maximumFractionDigits:0}).format(x)}catch(e){}
  return new Intl.NumberFormat("fr-CA",{maximumFractionDigits:0}).format(x)+(c?" "+c:"");
}
const fmt=(x,d=0)=>x===null||x===undefined||!isFinite(x)?"—":new Intl.NumberFormat("fr-CA",{maximumFractionDigits:d}).format(x);

  if(q.t==="num")return `<div class="num"><input type="number" step="any" inputmode="decimal" id="${q.id}" data-q="${q.id}" value="${esc(val??"")}" placeholder="${esc(q.ph||"")}"><span class="unit" data-unit="${q.id}">${esc(unitTxt(q.unit))}</span></div>`;

function onInput(el){
  const id=el.dataset.q,q=Q.find(x=>x.id===id);
  if(q.t==="multi"){
    let arr=Array.isArray(A[id])?[...A[id]]:[];
    if(el.checked){
      if(q.ex&&el.value===q.ex)arr=[q.ex];else{arr=arr.filter(x=>x!==q.ex);arr.push(el.value)}
    }else arr=arr.filter(x=>x!==el.value);
    A[id]=arr;
    app.querySelectorAll(`input[name="${id}"]`).forEach(c=>c.checked=arr.includes(c.value));
  }else A[id]=el.value;
  if(id==="P02"||id==="P02b")app.querySelectorAll("[data-unit]").forEach(u=>{const qq=Q.find(x=>x.id===u.dataset.unit);u.textContent=unitTxt(qq.unit)});
  app.querySelectorAll("[data-block]").forEach(b=>{b.hidden=!visible(Q.find(x=>x.id===b.dataset.block))});

      try{await d.save({filename:`diagnostic-${slug}.txt`,data:reportText()});}catch(e){}

function reportText(){
  const R=report(),rel=reliability(),L=[];
  const line=()=>L.push("");
  L.push("DIAGNOSTIC D'ENTREPRISE"+(isExample?" (exemple fictif)":""));
  L.push(`${v("P00")||"Entreprise sans nom"} — ${[v("P01"),CUR(),E()?fmt(E())+" personnes":null].filter(Boolean).join(", ")}`);
  L.push("Date : "+new Intl.DateTimeFormat("fr-CA",{dateStyle:"long"}).format(new Date()));
  line();
  if(R.global!==null){
    L.push(`SCORE GLOBAL : ${R.global}/100 (${levelTxt(R.global)})`);
    R.secs.forEach(s=>L.push(`  ${s.title} : ${s.r.score}/100 (${levelTxt(s.r.score)})`));
    line();
  }
  L.push("PROBLÈMES REPÉRÉS");
  if(R.issues.length)R.issues.forEach(i=>L.push(`  [${i.s===0?"Important":"À surveiller"}] ${i.q.issue} (${i.sec.title}, ${i.q.id})`));else L.push("  Aucun");
  line();
  L.push("TEMPS PERDU CONVERTI EN COÛT");
  if(R.costs.length){R.costs.forEach(c=>L.push(`  ${c.label} : ${fmt(c.hy)} h/an, ${money(c.money)}${c.pct!==null?", "+fmt(c.pct,1)+" % du CA":""}`));
    L.push(`  Total : ${fmt(R.totH)} h/an, ${money(R.totM)}${R.totP!==null?", "+fmt(R.totP,1)+" % du CA":""}`)}else L.push("  Non chiffré");
  line();
  L.push("INDICATEURS");
  const ecart=(n("FIN-05")!==null&&n("FIN-06")!==null)?n("FIN-05")-n("FIN-06"):null;
  L.push(`  Écart de trésorerie : ${ecart===null?"—":fmt(ecart)+" jours"}`);
  L.push(`  Roulement du personnel : ${n("RH-01")!==null&&E()?fmt(n("RH-01")/E()*100,1)+" %":"—"}`);
  L.push(`  Marge brute déclarée : ${n("FIN-02")===null?"—":fmt(n("FIN-02"),1)+" %"}`);
  L.push(`  Fiabilité des données : ${rel[0]}. ${rel[1]}`);
  line();
  L.push("RÉPONSES DÉTAILLÉES");
  visSections().forEach(s=>{
    const qs=Q.filter(q=>q.s===s.id&&visible(q)&&answered(q));if(!qs.length)return;
    L.push(`-- ${s.title}`);
    qs.forEach(q=>{let a=A[q.id];
      if(q.o){const lab=x=>(q.o.find(o=>o[0]===x)||[x,x])[1];a=Array.isArray(a)?a.map(lab).join(", "):lab(a)}
      L.push(`  ${q.id} ${q.q} → ${a}${q.unit&&q.t==="num"?" "+unitTxt(q.unit):""}`)});
  });
  return L.join("\n");
}
