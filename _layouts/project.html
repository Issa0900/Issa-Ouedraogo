<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.title }} · Issa Ouedraogo</title>
<meta name="description" content="{{ page.description | default: page.title }}{% unless page.description %} · projet d'Issa Ouedraogo, analyse de données et GESCOP.{% endunless %}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ page.title }} · Issa Ouedraogo" />
<meta property="og:description" content="{{ page.description | default: page.title }}" />
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
{% if page.image %}<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ page.image }}" />
<meta name="twitter:card" content="summary_large_image" />{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>

<header class="nav">
  <div class="nav-row">
    <a class="brand" href="../">Issa <span>Ouedraogo</span></a>
    <nav class="links">
      <a class="back" href="../#projets">← Portfolio</a>
    </nav>
  </div>
</header>

<main class="doc">
  <div class="doc-head">
    <p class="kicker">Projet · Portfolio d'Issa Ouedraogo</p>
  </div>
  <article class="doc-content">
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="contact-row" data-reveal>
      <h2>Discutons de votre prochain projet data.</h2>
      <div class="contact-links">
        <a href="mailto:issaouedraogo0900@gmail.com">issaouedraogo0900@gmail.com</a>
        <a href="https://www.linkedin.com/in/issa-ouedraogo-34b146332/" target="_blank" rel="noopener">LinkedIn →</a>
      </div>
    </div>
    <div class="foot-meta wrap" style="padding-left:0;padding-right:0;">
      <span>Issa Ouedraogo · Analyse de données et GESCOP</span>
      <a class="mono" href="../" style="text-decoration:none;color:inherit;">← Retour à l'accueil</a>
    </div>
  </div>
</footer>

<script src="../assets/js/site.js"></script>
</body>
</html>
